[service]
address=5997
address_prot=2
address_2=5999
address_prot_2=8
address_3=5998
address_prot_3=4
need_fc_special_svr_id=true


[CgkCfg]
redis=127.0.0.1:6379

[log]
log_level=debug # zap 没有 all,不推荐。最低等级是 debug
with_caller=true # 是否显行号
max_age=8 # 日志最大保存天数，不写默认0，无删除操作
use_new_rule=true # true 使用时间分隔日志 false 按照以前文件大小分隔日志
minute=30 # 1-60分钟 使用时间分隔日志的单位

[mysql]
address=127.0.0.1:3306
db_user="root"
pwd="mysql"
db_name="maze" # 本地使用的数据库名字