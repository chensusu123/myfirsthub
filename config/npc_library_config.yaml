# 图鉴品质配置
qualities:
  # 普通
  common: 1
  # 稀有
  rare: 2
  # 史诗
  epic: 3
  # 传说
  legendary: 4
  # 神话
  mythic: 5

# 图鉴组配置
groups:
  # 基础组
  basic: 1
  # 进阶组
  advanced: 2
  # 高级组
  high: 3
  # 顶级组
  top: 4

# 日志配置
logging:
  # 日志级别
  level: "info"
  # 日志文件路径
  file_path: "logs/npc_library.log"
  # 日志轮转大小（MB）
  max_size: 100
  # 日志保留天数
  max_age: 7
  # 日志备份数量
  max_backups: 3

# 监控配置
monitoring:
  # 是否启用监控
  enabled: true
  # 监控指标收集间隔（秒）
  collect_interval: 30
  # 告警阈值
  alerts:
    # 错误率阈值
    error_rate_threshold: 0.05
    # 响应时间阈值（毫秒）
    response_time_threshold: 1000
    # 数据库连接数阈值
    db_connection_threshold: 80


